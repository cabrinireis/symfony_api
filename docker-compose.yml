version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_api_app
    volumes:
      - ./symfony_api:/var/www
    networks:
      - symfony

  # db:
  #   image: postgres:15
  #   container_name: symfony_api_db
  #   environment:
  #     POSTGRES_DB: symfony_api
  #     POSTGRES_USER: symfony
  #     POSTGRES_PASSWORD: symfony
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - symfony

  web:
    image: nginx:alpine
    container_name: symfony_api_nginx
    ports:
      - "8080:80"
    volumes:
      - ./symfony_api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - symfony

# volumes:
#   postgres_data:

networks:
  symfony:
