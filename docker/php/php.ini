; Configurações PHP para upload de arquivos grandes
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Configurações para streaming
output_buffering = Off
implicit_flush = On
zlib.output_compression = Off

; Configurações de timeout
default_socket_timeout = 300

; Configurações de memória para PhpSpreadsheet
max_file_uploads = 20
